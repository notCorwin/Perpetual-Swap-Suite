name: Live OKX Integration

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okx-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  okx-live:
    name: Check live public OKX endpoints and integration
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Build renderer and record artifact validity
        shell: bash
        run: |
          mkdir -p artifacts/build
          node scripts/build-artifact-reuse.mjs build --manifest artifacts/build/renderer.json -- npm run build 2>&1 | tee artifacts/build/renderer-build.log
      - name: Record public endpoint availability
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const paths = [
            '/market/history-candles?instId=BTC-USDT-SWAP&bar=1H&limit=2',
            '/rubik/stat/contracts/open-interest-history?instId=BTC-USDT-SWAP&period=1H&limit=2',
            '/rubik/stat/taker-volume-contract?instId=BTC-USDT-SWAP&period=1H&unit=1&limit=2',
          ]
          const probes = await Promise.all(paths.map(async path => {
            const url = `https://www.okx.com/api/v5${path}`
            const startedAt = Date.now()
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(15_000) })
              const body = await response.text()
              let payload
              try { payload = JSON.parse(body) } catch {}
              return { url, status: response.status, code: payload?.code, elapsedMS: Date.now() - startedAt,
                ok: response.ok && payload?.code === '0', body: body.slice(0, 8192) }
            } catch (error) {
              return { url, ok: false, elapsedMS: Date.now() - startedAt,
                error: { name: error.name, message: error.message, cause: error.cause?.message, code: error.cause?.code } }
            }
          }))
          const report = { revision: process.env.GITHUB_SHA, observedAt: new Date().toISOString(), probes }
          await writeFile('artifacts/okx-endpoints.json', JSON.stringify(report, null, 2))
          console.log(JSON.stringify(report, null, 2))
          NODE
      - name: Run live market integration with temporary storage
        id: integration
        env:
          OKX_LIVE_TIMEOUT_MS: '120000'
        shell: bash
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          set +e
          npm run sandbox -- command --allow-network --output artifacts/sandbox -- node scripts/okx-live-1h.mjs 2>&1 | tee artifacts/okx-integration.log
          history_status="${PIPESTATUS[0]}"
          npm run sandbox -- command --allow-network --output artifacts/sandbox -- node scripts/okx-live-statistics.mjs --report artifacts/okx-statistics.json 2>&1 | tee artifacts/okx-statistics.log
          statistics_status="${PIPESTATUS[0]}"
          set -e
          echo "history-exit-code=$history_status" >> "$GITHUB_OUTPUT"
          echo "statistics-exit-code=$statistics_status" >> "$GITHUB_OUTPUT"
      - name: Check real native WebSocket subscriptions for every eligible contract
        id: streams
        shell: bash
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          set +e
          npm run sandbox -- command --allow-network --scenario okx-all-contract-streams --output artifacts/sandbox -- node scripts/okx-live-streams.mjs 2>&1 | tee artifacts/okx-streams.log
          streams_status="${PIPESTATUS[0]}"
          set -e
          echo "exit-code=$streams_status" >> "$GITHUB_OUTPUT"
      - name: Check real OKX prices in the hidden native app
        id: chart
        env:
          OKX_LIVE_CHART_OUTPUT: artifacts/okx-live-chart
        shell: bash
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          set +e
          npm run sandbox -- command --desktop --allow-network --scenario okx-live-chart --output artifacts/sandbox --require-category network --require-category database --require-category cpu --require-category io --require-category ipc --require-role electron-main --require-role renderer --require-role market-backend --require-role market-reader --require-role market-writer --require-role prepared-chart -- node scripts/okx-live-chart.mjs 2>&1 | tee artifacts/okx-chart.log
          chart_status="${PIPESTATUS[0]}"
          set -e
          echo "exit-code=$chart_status" >> "$GITHUB_OUTPUT"
      - name: Classify independent live checks
        env:
          HISTORY_EXIT_CODE: ${{ steps.integration.outputs.history-exit-code }}
          STATISTICS_EXIT_CODE: ${{ steps.integration.outputs.statistics-exit-code }}
          STREAMS_EXIT_CODE: ${{ steps.streams.outputs.exit-code }}
          CHART_EXIT_CODE: ${{ steps.chart.outputs.exit-code }}
        run: node scripts/okx-live-classify.mjs --artifacts artifacts
      - name: Retain external and integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: okx-live-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
