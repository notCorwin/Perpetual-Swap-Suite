name: Verify and Publish Electron macOS

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, types, core, and Electron E2E
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        id: dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check desktop syntax
        run: node scripts/check-desktop.mjs
      - name: Check types
        run: node_modules/.bin/tsc -b
      - name: Test core behavior
        run: npm run test:core -- --output artifacts/sandbox
      - name: Build renderer once and record reusable artifact validity
        shell: bash
        run: |
          mkdir -p artifacts/build
          node scripts/build-artifact-reuse.mjs build --manifest artifacts/build/renderer.json -- npm run build 2>&1 | tee artifacts/build/renderer-build.log
      - name: Test Electron with isolated fixtures
        run: npm run test:e2e -- --reuse-build-manifest artifacts/build/renderer.json --output artifacts/sandbox
      - name: Probe native GPU capabilities and verify accelerated chart work when available
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        # Hosted runners may expose software rendering. The dedicated report
        # distinguishes confirmed unsupported hardware from a passed GPU check.
        run: npm run test:gpu -- --reuse-build-manifest artifacts/build/renderer.json --output artifacts/sandbox
      - name: Verify workspace scaling and contrast
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          PERPETUAL_SWAP_UI_VISUAL_OUTPUT: artifacts/workspace-visual
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          npm run sandbox -- command --desktop --output artifacts/sandbox -- node scripts/workspace-visual-check.mjs
      - name: Verify short full-market intake under held statistics and archive writes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          PERPETUAL_SWAP_RESOURCE_REPORT: artifacts/market-resources.json
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          npm run sandbox -- command --desktop --foreground --output artifacts/sandbox -- node scripts/market-resource-benchmark.mjs
      - name: Enforce paired operation recording overhead budgets
        # Keep this independent gate collecting its own evidence after an
        # earlier acceptance failure. Its isolated pairs preserve the baseline.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          npm run benchmark:operations -- --output artifacts/operation-overhead
      - name: Retain sandbox recordings and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-e2e-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  chart-foreground:
    name: Native foreground chart and navigation timing
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Test native foreground charts and navigation
        id: native-charts
        run: npm run test:foreground -- --output artifacts/sandbox
      - name: Collect separate profiles after native chart acceptance failure
        if: ${{ failure() && steps.native-charts.outcome == 'failure' }}
        env:
          PERPETUAL_SWAP_RENDERER_DIAGNOSTICS: artifacts/native-chart-diagnostic-profile
        run: |
          test -f dist/index.html
          npm run sandbox -- command --desktop --foreground --output artifacts/diagnostic-sandbox -- node --test-concurrency=1 --test tests/e2e/chart-paint.foreground.mjs tests/e2e/instrument-navigation.foreground.mjs
      - name: Retain native timing diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chart-foreground-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  nightly-soak:
    name: Scheduled extended market soak and Metal observer
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Build renderer and record reusable artifact validity
        id: renderer-build
        shell: bash
        run: |
          mkdir -p artifacts/build
          node scripts/build-artifact-reuse.mjs build --manifest artifacts/build/renderer.json -- npm run build 2>&1 | tee artifacts/build/renderer-build.log
      - name: Run the fixed-rate full-market soak
        if: ${{ !cancelled() && steps.renderer-build.outcome == 'success' }}
        env:
          PERPETUAL_SWAP_RESOURCE_REPORT: artifacts/market-resources.json
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          npm run sandbox -- command --desktop --foreground --output artifacts/sandbox -- node scripts/market-resource-benchmark.mjs --ticks 240 --cadence-ms 500
      - name: Probe native Metal capability and collect observer measurements
        id: metal-observer
        if: ${{ !cancelled() && steps.renderer-build.outcome == 'success' }}
        run: |
          npm run benchmark:metal -- --output artifacts/metal-observer
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('artifacts/metal-observer/report.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `outcome=${report.outcome}\n`)
          if (report.outcome === 'unsupported') appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Metal observer overhead: **skipped**, native Metal device unavailable; no overhead gate was executed.\n')
          NODE
      - name: Enforce native Metal observer overhead budgets
        if: ${{ !cancelled() && steps.metal-observer.outcome == 'success' && steps.metal-observer.outputs.outcome != 'unsupported' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('artifacts/metal-observer/report.json', 'utf8'))
          assert.equal(report.outcome, 'passed')
          assert.equal(report.pairs.length, report.repeats)
          assert.equal(report.assessment.passed, true)
          NODE
      - name: Retain nightly soak recordings and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-soak-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  market-traffic:
    name: Native foreground market traffic gates
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Build current renderer and record artifact validity
        shell: bash
        run: |
          mkdir -p artifacts/build
          node scripts/build-artifact-reuse.mjs build --manifest artifacts/build/renderer.json -- npm run build 2>&1 | tee artifacts/build/renderer-build.log
      - name: Enforce current-version absolute traffic and responsiveness gates
        id: traffic-gate
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          npm run sandbox -- command --desktop --foreground --output artifacts/sandbox -- node scripts/market-traffic-benchmark.mjs --expect-optimized --foreground --output artifacts/market-traffic.json
      - name: Collect separate renderer diagnostics after traffic acceptance failure
        if: ${{ failure() && steps.traffic-gate.outcome == 'failure' }}
        env:
          PERPETUAL_SWAP_RENDERER_DIAGNOSTICS: artifacts/market-traffic-diagnostic-profile
        run: |
          node scripts/build-artifact-reuse.mjs verify --manifest artifacts/build/renderer.json
          npm run sandbox -- command --desktop --foreground --output artifacts/sandbox -- node scripts/market-traffic-benchmark.mjs --expect-optimized --foreground --output artifacts/market-traffic-diagnostic.json
      - name: Retain current-version traffic and timing diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-traffic-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  package-smoke:
    name: Package and smoke the macOS executable
    needs: [validate, chart-foreground, market-traffic]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Build ad-hoc signed app
        run: scripts/package-electron.sh
      - name: Smoke packaged executable
        id: smoke
        shell: bash
        run: |
          mkdir -p artifacts
          app="$(find dist -maxdepth 3 -type d -name 'Perpetual Swap Suite.app' -print)"
          test -n "$app"
          test -x "$app/Contents/MacOS/Perpetual Swap Suite"
          node scripts/test-sandbox.mjs command --output artifacts/sandbox -- node scripts/smoke-electron.mjs --app "$app" --revision "$GITHUB_SHA" --report artifacts/package-smoke.json 2>&1 | tee artifacts/package-smoke.log
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Archive smoke-tested app
        shell: bash
        env:
          APP_PATH: ${{ steps.smoke.outputs.app }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" Perpetual.Swap.Suite.app.zip
          sha256="$(shasum -a 256 Perpetual.Swap.Suite.app.zip | cut -d' ' -f1)"
          built_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          asset_url="${repository_url}/releases/download/autobuild/Perpetual.Swap.Suite.app.zip"
          commit_date="$(TZ=UTC git show -s --date=format-local:'%Y-%m-%dT%H:%M:%SZ' --format=%cd "$GITHUB_SHA")"
          printf '{"revision":"%s","asset_url":"%s","digest":"sha256:%s","published_at":"%s","commit_date":"%s"}\n' \
            "$GITHUB_SHA" "$asset_url" "$sha256" "$built_at" "$commit_date" > update.json
          printf 'Latest Electron build from `main`.\n\n[Download Perpetual Swap Suite](%s)\n' "$asset_url" > release-notes.md
      - name: Retain package smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-smoke-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-${{ github.sha }}
          path: |
            Perpetual.Swap.Suite.app.zip
            update.json
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish smoke-tested app
    needs: package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-${{ github.sha }}
      - name: Publish autobuild release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view autobuild >/dev/null 2>&1; then
            gh release create autobuild --target "$GITHUB_SHA" --title autobuild --latest \
              --notes-file release-notes.md
          fi
          gh release upload autobuild 'Perpetual.Swap.Suite.app.zip#Perpetual Swap Suite.app' --clobber
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/autobuild" \
            --jq '[.assets[] | select(.name == "Perpetual.Swap.Suite.app.zip")] | .[0].digest')"
          if [[ "$digest" != "sha256:$(shasum -a 256 Perpetual.Swap.Suite.app.zip | cut -d' ' -f1)" ]]; then
            echo 'Uploaded app digest does not match the build.' >&2
            exit 1
          fi
          gh release upload autobuild update.json --clobber
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/autobuild" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit autobuild --target "$GITHUB_SHA" --title autobuild --latest \
            --notes-file release-notes.md
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/autobuild" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --paginate |
            jq -r '.[] | select(.name != "Perpetual.Swap.Suite.app.zip" and .name != "update.json") | .id' |
            while read -r asset_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
            done
