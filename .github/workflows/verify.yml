name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, E2E, and Package (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Static checks, unit tests, and auto-fuzz
        run: npm run check
      - name: Build renderer and run Electron E2E
        run: npm run test:e2e
      - name: Package and smoke-test macOS app
        run: |
          npm run app
          node scripts/smoke-electron.mjs \
            --app "dist/mac-arm64/Perpetual Swap Suite.app" \
            --revision "$(git rev-parse HEAD)"
