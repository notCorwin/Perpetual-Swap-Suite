[package]
name = "radar-tauri-compare"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry"] }
serde_json = "=1.0.154"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSProcessInfo"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWindow"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false }
